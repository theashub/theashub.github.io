<style>
/* =========================================================
   theAShub
   LIGHTWEIGHT LINKTREE STYLE LANDING PAGE
   ========================================================= */

#ashub-landing{
  --text:#212428;
  --muted:#666;
  --border:#e4e6e8;
  --hover:#f7f7f7;

  width:100%;
  min-height:100vh;
  margin:0;
  padding:32px 14px 38px;

  background:#fff;
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  box-sizing:border-box;
}

#ashub-landing *,
#ashub-landing *::before,
#ashub-landing *::after{
  box-sizing:border-box;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.ashub-wrap{
  width:100%;
  max-width:650px;
  margin:0 auto;
  text-align:center;
}


/* =========================================================
   LOGO
   ========================================================= */

.ashub-logo{
  margin:0 0 14px;
}

.ashub-logo img{
  display:block;
  width:88px;
  height:88px;
  margin:0 auto;
  object-fit:contain;
  border-radius:50%;
}


/* =========================================================
   TITLE
   ========================================================= */

.ashub-title{
  margin:0;
  padding:0;

  color:#212428;

  font-size:26px;
  line-height:1.3;
  font-weight:800;
}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.ashub-description{
  max-width:570px;

  margin:8px auto 20px;

  color:#666;

  font-size:14px;
  line-height:1.6;
}


/* =========================================================
   SOCIAL MEDIA
   ========================================================= */

.ashub-social{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;

  gap:8px;

  margin:0 0 28px;
}

.ashub-social a{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff;

  border:1px solid var(--border);
  border-radius:50%;

  color:#212428;

  text-decoration:none;

  transition:
    transform .15s ease,
    background .15s ease;
}

.ashub-social a:hover{
  background:#f5f5f5;
  transform:translateY(-2px);
}

.ashub-social svg{
  width:18px;
  height:18px;
  display:block;
}

.ashub-social svg path{
  fill:currentColor;
}

.ashub-social svg .outline{
  fill:none;
  stroke:currentColor;
}

.ashub-social svg .white{
  fill:#fff;
}


/* =========================================================
   LATEST POSTS
   ========================================================= */

.ashub-latest{
  width:100%;
  margin:0;
  text-align:left;
}

.ashub-heading{
  margin:0 0 11px;

  color:#555;

  font-size:13px;
  line-height:1.4;

  font-weight:800;

  letter-spacing:.6px;
  text-transform:uppercase;
}


/* =========================================================
   POST CARD
   ========================================================= */

.ashub-post{
  width:100%;
  min-height:72px;

  display:flex;
  align-items:center;

  margin:0 0 9px;
  padding:8px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:12px;

  color:#212428;

  text-decoration:none;

  transition:
    background .15s ease,
    transform .15s ease;
}

.ashub-post:hover{
  background:var(--hover);
  transform:translateY(-1px);
}


/* =========================================================
   POST IMAGE
   ========================================================= */

.ashub-post-image{
  flex:0 0 64px;

  width:64px;
  height:54px;

  margin-right:11px;

  overflow:hidden;

  border-radius:8px;

  background:#f1f1f1;
}

.ashub-post-image img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
}


/* =========================================================
   POST TITLE
   ========================================================= */

.ashub-post-title{
  flex:1;
  min-width:0;

  margin:0;
  padding:0;

  color:#212428;

  font-size:13px;
  line-height:1.4;
  font-weight:700;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;

  overflow:hidden;
}


/* =========================================================
   POST ARROW
   ========================================================= */

.ashub-post-arrow{
  flex:0 0 auto;

  margin-left:7px;

  color:#888;

  font-size:19px;
  line-height:1;
}


/* =========================================================
   LOADING
   ========================================================= */

.ashub-loading{
  padding:15px 5px;

  color:#777;

  text-align:center;

  font-size:13px;
}


/* =========================================================
   CONTINUE BUTTON
   ========================================================= */

.ashub-continue{
  width:100%;
  min-height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-top:16px;
  padding:13px 18px;

  background:#212428;
  color:#fff;

  border-radius:12px;

  font-size:14px;
  font-weight:700;

  text-decoration:none;

  transition:
    background .15s ease,
    transform .15s ease;
}

.ashub-continue:hover{
  background:#111;
  transform:translateY(-1px);
}


/* =========================================================
   FOOTER
   ========================================================= */

.ashub-footer{
  margin-top:25px;

  color:#777;

  font-size:11px;
  line-height:1.7;

  text-align:center;
}

.ashub-footer a{
  color:#555;
  text-decoration:none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  #ashub-landing{
    padding:25px 11px 32px;
  }

  .ashub-logo img{
    width:80px;
    height:80px;
  }

  .ashub-title{
    font-size:23px;
  }

  .ashub-description{
    font-size:13px;
  }

  .ashub-social{
    gap:7px;
  }

  .ashub-social a{
    width:36px;
    height:36px;
  }

  .ashub-social svg{
    width:17px;
    height:17px;
  }

  .ashub-post{
    min-height:68px;
  }

  .ashub-post-image{
    flex-basis:58px;
    width:58px;
    height:50px;
  }

  .ashub-post-title{
    font-size:12.5px;
  }

}
</style>

<script>
(function(){

  "use strict";


  /* =====================================================
     SEO META TAGS
     ===================================================== */

  var SEO_TITLE =
    "theAShub - Education, Careers, Jobs & Opportunities";

  var SEO_DESCRIPTION =
    "theAShub helps learners and aspirants discover educational resources, career guidance, jobs, opportunities, important notifications and useful updates in one place.";

  var SITE_URL =
    "https://www.theashub.in/";

  var SHARE_IMAGE =
    "YOUR-LOGO-OR-SHARE-IMAGE-URL";


  /* =====================================================
     DOCUMENT TITLE
     ===================================================== */

  document.title = SEO_TITLE;


  /* =====================================================
     HELPER
     ===================================================== */

  function addMeta(name, content, property){

    var selector =
      property
        ? 'meta[property="' + property + '"]'
        : 'meta[name="' + name + '"]';

    var meta =
      document.head.querySelector(selector);

    if(!meta){

      meta =
        document.createElement("meta");

      if(property){
        meta.setAttribute(
          "property",
          property
        );
      }else{
        meta.setAttribute(
          "name",
          name
        );
      }

      document.head.appendChild(meta);

    }

    meta.setAttribute(
      "content",
      content
    );

  }


  /* =====================================================
     BASIC SEO
     ===================================================== */

  addMeta(
    "description",
    SEO_DESCRIPTION
  );

  addMeta(
    "robots",
    "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  );

  addMeta(
    "googlebot",
    "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  );

  addMeta(
    "author",
    "theAShub"
  );

  addMeta(
    "theme-color",
    "#ffffff"
  );


  /* =====================================================
     CANONICAL
     ===================================================== */

  var canonical =
    document.head.querySelector(
      'link[rel="canonical"]'
    );

  if(!canonical){

    canonical =
      document.createElement("link");

    canonical.rel =
      "canonical";

    document.head.appendChild(
      canonical
    );

  }

  canonical.href =
    SITE_URL;


  /* =====================================================
     OPEN GRAPH
     ===================================================== */

  addMeta(
    "",
    "website",
    "og:type"
  );

  addMeta(
    "",
    SEO_TITLE,
    "og:title"
  );

  addMeta(
    "",
    SEO_DESCRIPTION,
    "og:description"
  );

  addMeta(
    "",
    SITE_URL,
    "og:url"
  );

  addMeta(
    "",
    "theAShub",
    "og:site_name"
  );

  if(
    SHARE_IMAGE &&
    SHARE_IMAGE.indexOf("YOUR-") !== 0
  ){

    addMeta(
      "",
      SHARE_IMAGE,
      "og:image"
    );

  }


  /* =====================================================
     TWITTER / X
     ===================================================== */

  addMeta(
    "twitter:card",
    "summary_large_image"
  );

  addMeta(
    "twitter:title",
    SEO_TITLE
  );

  addMeta(
    "twitter:description",
    SEO_DESCRIPTION
  );

  if(
    SHARE_IMAGE &&
    SHARE_IMAGE.indexOf("YOUR-") !== 0
  ){

    addMeta(
      "twitter:image",
      SHARE_IMAGE
    );

  }


  /* =====================================================
     LATEST POSTS
     ===================================================== */

  var POST_COUNT = 5;

  var FEED_URL =
    "https://www.theashub.in/feeds/posts/default" +
    "?alt=json-in-script" +
    "&max-results=" +
    POST_COUNT +
    "&callback=ashubLatestPosts";


  /* =====================================================
     BLOGGER JSONP CALLBACK
     ===================================================== */

  window.ashubLatestPosts = function(data){

    var container =
      document.getElementById(
        "ashub-posts"
      );

    if(!container){
      return;
    }

    container.innerHTML = "";


    if(
      !data ||
      !data.feed ||
      !data.feed.entry ||
      !data.feed.entry.length
    ){

      container.innerHTML =
        '<div class="ashub-loading">' +
        'No latest posts available.' +
        '</div>';

      return;

    }


    data.feed.entry.forEach(
      function(entry){

        /* =========================
           TITLE
           ========================= */

        var title =
          entry.title &&
          entry.title.$t
            ? entry.title.$t
            : "Untitled";


        /* =========================
           URL
           ========================= */

        var postUrl =
          "#";

        if(entry.link){

          for(
            var i = 0;
            i < entry.link.length;
            i++
          ){

            if(
              entry.link[i].rel ===
              "alternate"
            ){

              postUrl =
                entry.link[i].href;

              break;

            }

          }

        }


        /* =========================
           IMAGE
           ========================= */

        var imageUrl =
          "";

        if(
          entry.media$thumbnail &&
          entry.media$thumbnail.url
        ){

          imageUrl =
            entry.media$thumbnail.url.replace(
              /\/s[0-9]+(-c)?\//,
              "/s200/"
            );

        }


        /* =========================
           CARD
           ========================= */

        var card =
          document.createElement("a");

        card.className =
          "ashub-post";

        card.href =
          postUrl;

        card.target =
          "_blank";

        card.rel =
          "noopener noreferrer";


        /* =========================
           IMAGE
           ========================= */

        var imageBox =
          document.createElement("div");

        imageBox.className =
          "ashub-post-image";


        if(imageUrl){

          var image =
            document.createElement("img");

          image.src =
            imageUrl;

          image.width =
            64;

          image.height =
            54;

          image.alt =
            "";

          image.loading =
            "lazy";

          image.decoding =
            "async";

          imageBox.appendChild(
            image
          );

        }


        /* =========================
           TITLE
           ========================= */

        var titleBox =
          document.createElement("div");

        titleBox.className =
          "ashub-post-title";

        titleBox.textContent =
          title;


        /* =========================
           ARROW
           ========================= */

        var arrow =
          document.createElement("div");

        arrow.className =
          "ashub-post-arrow";

        arrow.textContent =
          "›";


        /* =========================
           BUILD CARD
           ========================= */

        card.appendChild(
          imageBox
        );

        card.appendChild(
          titleBox
        );

        card.appendChild(
          arrow
        );


        container.appendChild(
          card
        );

      }
    );

  };


  /* =====================================================
     LOAD BLOGGER FEED
     ===================================================== */

  var feedScript =
    document.createElement(
      "script"
    );

  feedScript.src =
    FEED_URL;

  feedScript.async =
    true;

  document.body.appendChild(
    feedScript
  );


})();
</script>
