<!-- theAShub Landing Page -->
<style>#ashub-landing{--text:#212428;--border:#fac926;width:100%;min-height:100vh;margin:0;padding:32px 14px 38px;box-sizing:border-box;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
#ashub-landing *{box-sizing:border-box;}
.ashub-wrap{width:100%;max-width:650px;margin:auto;text-align:center;}
.ashub-logo{margin:0 0 14px;}
.ashub-logo img{display:block;width:88px;height:88px;margin:auto;object-fit:contain;border-radius:50%;}
.ashub-title{margin:0;color:#212428;font-size:26px;line-height:1.3;font-weight:700;}
.ashub-description{max-width:570px;margin:8px auto 20px;color:#212428;
  font-size:17px;line-height:1.6;}
.ashub-social{display:flex; align-items:center;justify-content:center;flex-wrap:wrap; gap:8px; margin-bottom:28px;}
.ashub-social a{display:flex;align-items:center;justify-content:center;width:38px; height:38px;border:1px solid var(--border);border-radius:50%;background:#fff;color:#212428;text-decoration:none;transition:transform .15s ease,background .15s ease;}
.ashub-social a:hover{transform:translateY(-2px);}
.ashub-social svg{display:block;width:18px;height:18px;}
.ashub-social svg path{
  fill:currentColor;}
.ashub-social svg .outline{
  fill:none;
  stroke:currentColor;}
.ashub-social svg .white{
  fill:#fff;}
.ashub-latest{ width:100%; text-align:left;}
.ashub-post{display:flex;align-items:center;width:100%;min-height:72px;margin-bottom:9px;padding:8px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#212428;text-decoration:none;transition:transform .15s ease,background .15s ease;}
.ashub-post:hover{transform:translateY(-1px);}
.ashub-post-image{flex:0 0 64px;width:64px;height:54px;margin-right:11px;overflow:hidden;border-radius:8px;background:#fac926;}
.ashub-post-image img{display:block;width:100%;height:100%;object-fit:cover;}
.ashub-post-title{
  flex:1;min-width:0;
  margin:0;color:#212428;
  font-size:15px;line-height:1.4;
  font-weight:700;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.ashub-post-arrow{
  flex:0 0 auto;
  margin-left:7px;
  color:#888;
  font-size:19px;
  line-height:1;
}

/* Skeleton */

.ashub-skeleton{
  display:flex;
  align-items:center;
  width:100%;
  min-height:72px;
  margin-bottom:9px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
}

.ashub-skeleton-image{
  flex:0 0 64px;
  width:64px;
  height:54px;
  margin-right:11px;
  border-radius:8px;
  background:#edf0f3;
  animation:tashubPulse 1.2s ease-in-out infinite;
}

.ashub-skeleton-content{
  flex:1;
  min-width:0;
}

.ashub-skeleton-title{
  display:block;
  width:92%;
  height:13px;
  margin-bottom:8px;
  border-radius:4px;
  background:#edf0f3;
  animation:tashubPulse 1.2s ease-in-out infinite;
}

.ashub-skeleton-title.short{
  width:68%;
}

.ashub-skeleton-meta{
  display:block;
  width:35%;
  height:8px;
  border-radius:4px;
  background:#edf0f3;
  animation:tashubPulse 1.2s ease-in-out infinite;
}

@keyframes tashubPulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

.ashub-continue{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:52px;
  margin-top:16px;
  padding:13px 18px;
  border-radius:12px;
  background:#212428;
  color:#fff;
  font-size:14px;
  font-weight:700;
  text-decoration:none;
  transition:transform .15s ease,background .15s ease;
}

.ashub-continue:hover{
  background:#111;
  transform:translateY(-1px);
}

.ashub-footer{
  margin-top:25px;
  color:#777;
  font-size:11px;
  line-height:1.7;
  text-align:center;
}

.ashub-footer a{
  color:#555;
  text-decoration:none;
}

@media(max-width:600px){
  #ashub-landing{
    padding:25px 11px 32px;
  }

  .ashub-logo img{
    width:80px;
    height:80px;
  }

  .ashub-title{
    font-size:23px;
  }

  .ashub-description{
    font-size:15px;
  }

  .ashub-social{
    gap:7px;
  }

  .ashub-social a{
    width:36px;
    height:36px;
  }

  .ashub-social svg{
    width:17px;
    height:17px;
  }

  .ashub-post,
  .ashub-skeleton{
    min-height:68px;
  }

  .ashub-post-image,
  .ashub-skeleton-image{
    flex-basis:58px;
    width:58px;
    height:50px;
  }

  .ashub-post-title{
    font-size:14px;
  }
}
</style>

<script>
(function(){

  "use strict";

  var SEO_TITLE =
    "theAShub - Education, Careers, Jobs & Opportunities";

  var SEO_DESCRIPTION =
    "theAShub helps learners and aspirants discover educational resources, career guidance, jobs, opportunities, important notifications and useful updates in one place.";

  var SITE_URL =
    "https://www.theashub.in/";

  var SHARE_IMAGE =
    "YOUR-LOGO-OR-SHARE-IMAGE-URL";

  var FAVICON_URL =
    "YOUR-FAVICON-URL";

  /* SEO */

  document.title = SEO_TITLE;

  function meta(name,content,property){

    var selector = property
      ? 'meta[property="' + property + '"]'
      : 'meta[name="' + name + '"]';

    var el = document.head.querySelector(selector);

    if(!el){
      el = document.createElement("meta");

      if(property){
        el.setAttribute("property",property);
      }else{
        el.setAttribute("name",name);
      }

      document.head.appendChild(el);
    }

    el.setAttribute("content",content);
  }

  meta("description",SEO_DESCRIPTION);
  meta("robots","index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1");
  meta("googlebot","index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1");
  meta("author","theAShub");
  meta("theme-color","#ffffff");
  meta("format-detection","telephone=no");

  var canonical =
    document.head.querySelector('link[rel="canonical"]');

  if(!canonical){
    canonical = document.createElement("link");
    canonical.rel = "canonical";
    document.head.appendChild(canonical);
  }

  canonical.href = SITE_URL;

  if(FAVICON_URL.indexOf("YOUR-") !== 0){

    var favicon =
      document.head.querySelector('link[rel="icon"]');

    if(!favicon){
      favicon = document.createElement("link");
      favicon.rel = "icon";
      favicon.type = "image/png";
      document.head.appendChild(favicon);
    }

    favicon.href = FAVICON_URL;
  }

  meta("","website","og:type");
  meta("",SEO_TITLE,"og:title");
  meta("",SEO_DESCRIPTION,"og:description");
  meta("",SITE_URL,"og:url");
  meta("","theAShub","og:site_name");

  meta("twitter:card","summary_large_image");
  meta("twitter:title",SEO_TITLE);
  meta("twitter:description",SEO_DESCRIPTION);

  if(SHARE_IMAGE.indexOf("YOUR-") !== 0){
    meta("","", "");
    meta("twitter:image",SHARE_IMAGE);
    meta("","", "");
    meta("og:image",SHARE_IMAGE);
  }

  /* Blogger Posts */

  var count = 5;

  var feed =
    "https://www.theashub.in/feeds/posts/default" +
    "?alt=json-in-script" +
    "&max-results=" + count +
    "&callback=ashubLatestPosts";

  window.ashubLatestPosts = function(data){

    var container =
      document.getElementById("ashub-posts");

    if(!container) return;

    if(!data ||
       !data.feed ||
       !data.feed.entry ||
       !data.feed.entry.length){

      container.innerHTML =
        '<div class="ashub-loading">No latest posts available.</div>';

      return;
    }

    var fragment = document.createDocumentFragment();

    data.feed.entry.forEach(function(entry){

      var title =
        entry.title && entry.title.$t
          ? entry.title.$t
          : "Untitled";

      var url = "#";

      if(entry.link){

        for(var i=0;i<entry.link.length;i++){

          if(entry.link[i].rel === "alternate"){
            url = entry.link[i].href;
            break;
          }

        }

      }

      var imageUrl = "";

      if(entry.media$thumbnail &&
         entry.media$thumbnail.url){

        imageUrl =
          entry.media$thumbnail.url.replace(
            /\/s[0-9]+(-c)?\//,
            "/s200/"
          );
      }

      var card =
        document.createElement("a");

      card.className = "ashub-post";
      card.href = url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      var imageBox =
        document.createElement("div");

      imageBox.className =
        "ashub-post-image";

      if(imageUrl){

        var image =
          document.createElement("img");

        image.src = imageUrl;
        image.width = 64;
        image.height = 54;
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";

        imageBox.appendChild(image);
      }

      var titleBox =
        document.createElement("div");

      titleBox.className =
        "ashub-post-title";

      titleBox.textContent = title;

      var arrow =
        document.createElement("div");

      arrow.className =
        "ashub-post-arrow";

      arrow.textContent = "›";

      card.appendChild(imageBox);
      card.appendChild(titleBox);
      card.appendChild(arrow);

      fragment.appendChild(card);

    });

    container.replaceChildren(fragment);

  };

  var script =
    document.createElement("script");

  script.src = feed;
  script.async = true;

  document.body.appendChild(script);

})();
</script>
