<!-- theAShub Landing Page -->
<style>
#ashub-landing{
  --text:#212428;
  --border:#fac926;
  width:100%;
  min-height:100vh;
  margin:0;
  padding:32px 16px 40px;
  box-sizing:border-box;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
#ashub-landing *{box-sizing:border-box}

.ashub-wrap{
  width:100%;
  max-width:680px;
  margin:auto;
  text-align:center;
}

/* Logo */
.ashub-logo{margin-bottom:14px}
.ashub-logo img{
  width:88px;
  height:88px;
  display:block;
  margin:auto;
  object-fit:contain;
  border-radius:50%;
}

/* Heading */
.ashub-title{
  margin:0;
  font-size:clamp(24px,4vw,30px);
  line-height:1.25;
  font-weight:700;
  color:#212428;
}

.ashub-description{
  max-width:580px;
  margin:10px auto 22px;
  font-size:clamp(15px,2.5vw,17px);
  line-height:1.65;
  color:#212428;
}

/* Social */
.ashub-social{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:26px;
}
.ashub-social a{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--border);
  border-radius:50%;
  background:#fff;
  color:#212428;
  text-decoration:none;
  transition:.2s;
}
.ashub-social a:hover{
  transform:translateY(-2px);
}
.ashub-social svg{
  width:19px;
  height:19px;
  display:block;
}
.ashub-social svg path{fill:currentColor}
.ashub-social .outline{fill:none;stroke:currentColor}
.ashub-social .white{fill:#fff}

/* Posts */
.ashub-latest{width:100%;text-align:left}

.ashub-post,
.ashub-skeleton{
  display:flex;
  align-items:center;
  width:100%;
  min-height:78px;
  padding:8px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
}

.ashub-post{
  color:#212428;
  text-decoration:none;
  transition:.2s;
}
.ashub-post:hover{
  transform:translateY(-1px);
}

.ashub-post-image,
.ashub-skeleton-image{
  flex:0 0 72px;
  width:72px;
  height:56px;
  margin-right:12px;
  border-radius:8px;
  overflow:hidden;
  background:#edf0f3;
}

.ashub-post-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.ashub-post-title{
  flex:1;
  min-width:0;
  font-size:15px;
  font-weight:700;
  line-height:1.45;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.ashub-post-arrow{
  margin-left:8px;
  font-size:20px;
  color:#888;
}

/* Skeleton */
.ashub-skeleton-title,
.ashub-skeleton-meta,
.ashub-skeleton-image{
  background:#edf0f3;
  animation:pulse 1.2s infinite ease-in-out;
}
.ashub-skeleton-content{flex:1}
.ashub-skeleton-title{
  height:13px;
  border-radius:4px;
  margin-bottom:8px;
  width:90%;
}
.ashub-skeleton-title.short{width:65%}
.ashub-skeleton-meta{
  width:35%;
  height:8px;
  border-radius:4px;
}
@keyframes pulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

/* Button */
.ashub-continue{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  min-height:52px;
  margin-top:18px;
  padding:14px 18px;
  border-radius:12px;
  background:#212428;
  color:#fff;
  font-size:15px;
  font-weight:700;
  text-decoration:none;
  transition:.2s;
}
.ashub-continue:hover{
  background:#111;
}

/* Footer */
.ashub-footer{
  margin-top:24px;
  font-size:11px;
  color:#777;
  line-height:1.7;
}
.ashub-footer a{
  color:#555;
  text-decoration:none;
}

/* ---------- Tablet ---------- */
@media (max-width:768px){
  #ashub-landing{padding:28px 14px 34px}
  .ashub-wrap{max-width:100%}
}

/* ---------- Mobile ---------- */
@media (max-width:480px){
  #ashub-landing{padding:22px 12px 30px}

  .ashub-logo img{
    width:74px;
    height:74px;
  }

  .ashub-social{
    gap:8px;
  }

  .ashub-social a{
    width:38px;
    height:38px;
  }

  .ashub-post,
  .ashub-skeleton{
    min-height:72px;
    padding:7px;
  }

  .ashub-post-image,
  .ashub-skeleton-image{
    flex-basis:62px;
    width:62px;
    height:50px;
    margin-right:10px;
  }

  .ashub-post-title{
    font-size:14px;
  }

  .ashub-post-arrow{
    font-size:18px;
  }

  .ashub-continue{
    font-size:14px;
  }
}
</style>

<script>
(function(){

  "use strict";

  var SEO_TITLE =
    "theAShub - Education, Careers, Jobs & Opportunities";

  var SEO_DESCRIPTION =
    "theAShub helps learners and aspirants discover educational resources, career guidance, jobs, opportunities, important notifications and useful updates in one place.";

  var SITE_URL =
    "https://www.theashub.in/";

  var SHARE_IMAGE =
    "YOUR-LOGO-OR-SHARE-IMAGE-URL";

  var FAVICON_URL =
    "YOUR-FAVICON-URL";

  /* SEO */

  document.title = SEO_TITLE;

  function meta(name,content,property){

    var selector = property
      ? 'meta[property="' + property + '"]'
      : 'meta[name="' + name + '"]';

    var el = document.head.querySelector(selector);

    if(!el){
      el = document.createElement("meta");

      if(property){
        el.setAttribute("property",property);
      }else{
        el.setAttribute("name",name);
      }

      document.head.appendChild(el);
    }

    el.setAttribute("content",content);
  }

  meta("description",SEO_DESCRIPTION);
  meta("robots","index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1");
  meta("googlebot","index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1");
  meta("author","theAShub");
  meta("theme-color","#ffffff");
  meta("format-detection","telephone=no");

  var canonical =
    document.head.querySelector('link[rel="canonical"]');

  if(!canonical){
    canonical = document.createElement("link");
    canonical.rel = "canonical";
    document.head.appendChild(canonical);
  }

  canonical.href = SITE_URL;

  if(FAVICON_URL.indexOf("YOUR-") !== 0){

    var favicon =
      document.head.querySelector('link[rel="icon"]');

    if(!favicon){
      favicon = document.createElement("link");
      favicon.rel = "icon";
      favicon.type = "image/png";
      document.head.appendChild(favicon);
    }

    favicon.href = FAVICON_URL;
  }

  meta("","website","og:type");
  meta("",SEO_TITLE,"og:title");
  meta("",SEO_DESCRIPTION,"og:description");
  meta("",SITE_URL,"og:url");
  meta("","theAShub","og:site_name");

  meta("twitter:card","summary_large_image");
  meta("twitter:title",SEO_TITLE);
  meta("twitter:description",SEO_DESCRIPTION);

  if(SHARE_IMAGE.indexOf("YOUR-") !== 0){
    meta("","", "");
    meta("twitter:image",SHARE_IMAGE);
    meta("","", "");
    meta("og:image",SHARE_IMAGE);
  }

  /* Blogger Posts */

  var count = 5;

  var feed =
    "https://www.theashub.in/feeds/posts/default" +
    "?alt=json-in-script" +
    "&max-results=" + count +
    "&callback=ashubLatestPosts";

  window.ashubLatestPosts = function(data){

    var container =
      document.getElementById("ashub-posts");

    if(!container) return;

    if(!data ||
       !data.feed ||
       !data.feed.entry ||
       !data.feed.entry.length){

      container.innerHTML =
        '<div class="ashub-loading">No latest posts available.</div>';

      return;
    }

    var fragment = document.createDocumentFragment();

    data.feed.entry.forEach(function(entry){

      var title =
        entry.title && entry.title.$t
          ? entry.title.$t
          : "Untitled";

      var url = "#";

      if(entry.link){

        for(var i=0;i<entry.link.length;i++){

          if(entry.link[i].rel === "alternate"){
            url = entry.link[i].href;
            break;
          }

        }

      }

      var imageUrl = "";

      if(entry.media$thumbnail &&
         entry.media$thumbnail.url){

        imageUrl =
          entry.media$thumbnail.url.replace(
            /\/s[0-9]+(-c)?\//,
            "/s200/"
          );
      }

      var card =
        document.createElement("a");

      card.className = "ashub-post";
      card.href = url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      var imageBox =
        document.createElement("div");

      imageBox.className =
        "ashub-post-image";

      if(imageUrl){

        var image =
          document.createElement("img");

        image.src = imageUrl;
        image.width = 64;
        image.height = 54;
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";

        imageBox.appendChild(image);
      }

      var titleBox =
        document.createElement("div");

      titleBox.className =
        "ashub-post-title";

      titleBox.textContent = title;

      var arrow =
        document.createElement("div");

      arrow.className =
        "ashub-post-arrow";

      arrow.textContent = "›";

      card.appendChild(imageBox);
      card.appendChild(titleBox);
      card.appendChild(arrow);

      fragment.appendChild(card);

    });

    container.replaceChildren(fragment);

  };

  var script =
    document.createElement("script");

  script.src = feed;
  script.async = true;

  document.body.appendChild(script);

})();
</script>
